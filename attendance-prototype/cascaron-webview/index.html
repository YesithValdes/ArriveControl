<!doctype html>
<!-- Respaldo LOCAL del cascarón Capacitor. La app real vive en el servidor
     (capacitor.config.json → server.url); esta página solo se ve si el
     dispositivo no puede alcanzar el servidor al abrir la app. -->
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Control Registro</title>
  <style>
    body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font-family: system-ui, sans-serif; background: #16224e; color: #fff; text-align: center; padding: 24px; }
    b { letter-spacing: .08em; }
    p { opacity: .8; max-width: 300px; line-height: 1.5; }
    button { margin-top: 8px; padding: 12px 32px; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; background: #fff; color: #16224e; }
  </style>
</head>
<body>
  <b>CONTROL REGISTRO</b>
  <p>Sin conexión con el servidor. Verifica el internet del dispositivo y vuelve a intentar.</p>
  <button onclick="location.reload()">Reintentar</button>
</body>
</html>

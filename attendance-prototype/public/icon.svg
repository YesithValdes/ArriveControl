<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Logo AsistencIA — «Presente ✓»: un rostro cuya mandíbula se convierte
       en chulo de verificación (identidad confirmada + asistencia marcada).
       Blanco y aguamarina sobre el degradado de marca (acero → aero). -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="64" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#223347"/>
      <stop offset="1" stop-color="#6e96b8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#fondo)"/>
  <circle cx="32" cy="31" r="20" stroke="#fff" stroke-width="4.6" fill="none"/>
  <circle cx="25.4" cy="27" r="2.2" fill="#fff"/>
  <circle cx="38.6" cy="27" r="2.2" fill="#fff"/>
  <path d="M 24 37 l 6 6 l 12 -12" stroke="#9fdcca" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
